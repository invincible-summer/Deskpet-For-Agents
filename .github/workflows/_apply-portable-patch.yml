name: apply-portable-patch

on:
  push:
    branches:
      - release/portable-exe

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/portable-exe
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Apply repository patch
        run: python tools/_apply_portable_patch.py
      - name: Apply acceptance fixes
        run: python tools/_fix_after_portable_patch.py
      - name: Keep Settings page compact
        run: python tools/_fix_dashboard_compact.py
      - name: Suppress redundant Dashboard reflow
        run: python tools/_fix_dashboard_reflow.py
      - name: Harden release build
        run: python tools/_fix_release_build.py
      - name: Remove staging patch machinery
        shell: pwsh
        run: |
          Remove-Item tools/_apply_portable_patch.py
          Remove-Item tools/_fix_after_portable_patch.py
          Remove-Item tools/_fix_dashboard_compact.py
          Remove-Item tools/_fix_dashboard_reflow.py
          Remove-Item tools/_fix_release_build.py
          Remove-Item .github/workflows/_apply-portable-patch.yml
      - name: Byte-compile
        run: python -m compileall agents pet actions tools
      - name: Unit tests
        run: python -m unittest discover tests -p "test_*.py"
      - name: Monitor benchmark
        run: python tests/benchmark_monitor.py --ticks 5000 --report benchmark-report.json
      - name: Desktop sources benchmark
        run: python tests/benchmark_desktop_sources.py --ticks 5000 --report desktop-source-benchmark.json
      - name: Presentation benchmark
        run: python tests/benchmark_presentation.py --report presentation-benchmark.json
      - name: UI architecture benchmark
        run: python tests/benchmark_ui_architecture.py --report ui-architecture-benchmark.json
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build and accept portable standalone
        run: python tools/build_release.py
      - name: Commit implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The Actions token may write repository contents but cannot modify
          # workflow files. Keep the staging workflow tracked for this push and
          # let the repository connector replace workflow files after validation.
          git restore --source=HEAD -- .github/workflows/_apply-portable-patch.yml
          if (Test-Path .github/workflows/release.yml) { Remove-Item .github/workflows/release.yml }
          git add -A
          git commit -m "feat: add portable standalone release architecture"
          git push origin HEAD:release/portable-exe
