name: v410-fixup-once

on:
  push:
    branches:
      - chore/v4.1.0-versioning

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/v4.1.0-versioning
          fetch-depth: 0
      - name: Update only remaining 4.1.0 references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for name in ("tools/desktop_source_probe.py", "tests/test_zcode_wsl_remote.py"):
              path = Path(name)
              data = path.read_bytes()
              if b"4.0.1" in data:
                  path.write_bytes(data.replace(b"4.0.1", b"4.1.0"))
                  changed.append(name)
          print("changed:", changed)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/desktop_source_probe.py tests/test_zcode_wsl_remote.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No remaining references"
            exit 0
          fi
          git commit -m "chore(version): finish 4.1.0 references"
          git push origin HEAD:chore/v4.1.0-versioning
