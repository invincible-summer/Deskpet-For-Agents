name: v410-fixup-once

on:
  push:
    branches:
      - chore/v4.1.0-versioning

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/v4.1.0-versioning
          fetch-depth: 0
      - name: Update remaining version references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("tools/desktop_source_probe.py", "tests/test_zcode_wsl_remote.py"):
              path = Path(name)
              data = path.read_bytes()
              old = b"4.0.1"
              count = data.count(old)
              if count == 0:
                  raise SystemExit(f"{name}: expected at least one 4.0.1 reference")
              path.write_bytes(data.replace(old, b"4.1.0"))
              print(name, count)
          PY
          git diff --check
      - name: Commit clean fixup and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/v410-fixup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(version): finish 4.1.0 references"
          git push origin HEAD:chore/v4.1.0-versioning
