name: publish-v4-once

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: "github.event.head_commit.message == 'chore(release): publish v4.0.0 from accepted artifact'"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: "34685495370"
      ARTIFACT_NAME: DeskPet-windows-x64-portable
      TAG: v4.0.0
    steps:
      - name: Download accepted portable artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir release-assets
          test -s release-assets/DeskPet-windows-x64-portable.zip
          test -s release-assets/SHA256SUMS.txt
          ls -lh release-assets

      - name: Publish canonical v4.0.0 release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$TAG" \
            release-assets/DeskPet-windows-x64-portable.zip \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DeskPet v4.0.0" \
            --generate-notes \
            --draft
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
