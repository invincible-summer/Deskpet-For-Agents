name: Apply DeskPet 4.0.1 clean implementation

on:
  push:
    branches: [automation/zcode-wsl-clean]
    paths:
      - '.deskpet/v401.part*'
      - '.deskpet/fix_anchor.py'
      - '.github/workflows/apply-v401-once.yml'

permissions: {contents: write}

jobs:
  apply-test-clean:
    if: "github.event.head_commit.message != 'fix(zcode): support WSL remote development in 4.0.1'"
    runs-on: windows-latest
    timeout-minutes: 35
    env: {PYTHONUTF8: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Preserve repository blob bytes
        shell: pwsh
        run: |
          git config core.autocrlf false
          [IO.File]::WriteAllText((Join-Path $PWD '.git/info/attributes'), "* -text`n", [Text.Encoding]::ASCII)
          git reset --hard HEAD
          if (@(git status --porcelain).Count) { throw 'checkout is not byte-clean' }
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - name: Decode and apply patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem .deskpet/v401.part* | Sort-Object Name
          $payload = ($parts | ForEach-Object { [IO.File]::ReadAllText($_.FullName) }) -join ''
          $b64 = Join-Path $env:RUNNER_TEMP 'apply_v401.b64'; $script = Join-Path $env:RUNNER_TEMP 'apply_v401.py'
          [IO.File]::WriteAllText($b64, $payload, [Text.Encoding]::ASCII)
          python -c "import base64,gzip,pathlib,sys; pathlib.Path(sys.argv[2]).write_bytes(gzip.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_bytes())))" $b64 $script
          python .deskpet/fix_anchor.py $script
          python $script
      - name: Validate planned diff only
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $changed = @((git diff --name-only) + (git ls-files --others --exclude-standard)) | Where-Object { $_ -notlike '.deskpet/*' } | Sort-Object -Unique
          $allowed = @('agents/discovery.py','agents/models.py','agents/monitor.py','agents/paths.py','agents/zcode_desktop.py','agents/zcode_remote.py','pet/labels.py','pet/version.py','tools/desktop_source_probe.py','tests/test_zcode_wsl_remote.py','README.md','CHANGELOG.md','VERSIONING.md') | Sort-Object
          if (@($changed | Where-Object { $_ -notin $allowed }).Count) { throw 'unexpected changed file' }
          if (@($allowed | Where-Object { $_ -notin $changed }).Count) { throw 'expected changed file missing' }
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Compile
        shell: pwsh
        run: |
          python -m compileall -q agents pet actions tools tests 2>&1 | Tee-Object -FilePath .deskpet/gate-result.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path .deskpet/gate-result.txt) { Remove-Item -Force .deskpet/gate-result.txt }
      - name: Unit tests
        shell: pwsh
        run: |
          python -m unittest discover tests -p "test_*.py" 2>&1 | Tee-Object -FilePath .deskpet/gate-result.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path .deskpet/gate-result.txt) { Remove-Item -Force .deskpet/gate-result.txt }
      - name: Monitor benchmark
        shell: pwsh
        run: |
          python tests/benchmark_monitor.py --ticks 5000 --report benchmark-report.json 2>&1 | Tee-Object -FilePath .deskpet/gate-result.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path .deskpet/gate-result.txt) { Remove-Item -Force .deskpet/gate-result.txt }
      - name: Desktop source benchmark
        shell: pwsh
        run: |
          python tests/benchmark_desktop_sources.py --ticks 5000 --report desktop-source-benchmark.json 2>&1 | Tee-Object -FilePath .deskpet/gate-result.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path .deskpet/gate-result.txt) { Remove-Item -Force .deskpet/gate-result.txt }
      - name: Presentation benchmark
        shell: pwsh
        run: |
          python tests/benchmark_presentation.py --report presentation-benchmark.json 2>&1 | Tee-Object -FilePath .deskpet/gate-result.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path .deskpet/gate-result.txt) { Remove-Item -Force .deskpet/gate-result.txt }
      - name: UI architecture benchmark
        shell: pwsh
        run: |
          python tests/benchmark_ui_architecture.py --report ui-architecture-benchmark.json 2>&1 | Tee-Object -FilePath .deskpet/gate-result.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path .deskpet/gate-result.txt) { Remove-Item -Force .deskpet/gate-result.txt }
      - name: Capture failed transformed tree
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path .deskpet/gate-result.txt) { Copy-Item -Force .deskpet/gate-result.txt .deskpet/fix_anchor.py }
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): capture 4.0.1 diagnostic tree"
          if ($LASTEXITCODE -ne 0) { throw 'diagnostic commit failed' }
          git push --force origin HEAD:automation/zcode-wsl-diag
          if ($LASTEXITCODE -ne 0) { throw 'diagnostic push failed' }
      - name: Commit clean implementation
        if: success()
        shell: pwsh
        run: |
          Remove-Item -Force .deskpet/v401.part00,.deskpet/v401.part01,.deskpet/v401.part02,.deskpet/fix_anchor.py
          Remove-Item -Force .github/workflows/apply-v401-once.yml
          if (Test-Path .deskpet) { if (@(Get-ChildItem .deskpet -Force).Count -eq 0) { Remove-Item -Force .deskpet } }
          git add -A; git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(zcode): support WSL remote development in 4.0.1"
          if ($LASTEXITCODE -ne 0) { throw 'implementation commit failed' }
          git push origin HEAD:automation/zcode-wsl-clean
          if ($LASTEXITCODE -ne 0) { throw 'implementation push failed' }
