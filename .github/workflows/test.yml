name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      # windows runner 默认代码页 cp1252，中文输出会 UnicodeEncodeError
      PYTHONUTF8: "1"
    steps:
      # actions 固定到当前大版本（Node 24 运行时）：v4/v5 一代已被
      # GitHub 标记 Node 20 deprecated，结束强制迁移后会直接失败。
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt
      - name: Byte-compile
        run: python -m compileall agents pet actions tools
      - name: Unit tests
        shell: pwsh
        run: |
          python --version | Tee-Object -FilePath unittest-output.log
          python -m pip list --format=freeze | Tee-Object -Append unittest-output.log
          python -m unittest discover tests -p "test_*.py" 2>&1 | Tee-Object -Append unittest-output.log
          exit $LASTEXITCODE
      - name: Publish failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          # 失败输出尾部写入 step summary（公开可读），FAIL/ERROR 行转为
          # error 注解（annotations API 公开可读），完整日志上传 artifact。
          $log = Get-Content unittest-output.log -Raw
          $tail = $log.Substring([Math]::Max(0, $log.Length - 12000))
          Add-Content $env:GITHUB_STEP_SUMMARY "## Unit test output (tail)`n``````$tail``````"
          Select-String -Path unittest-output.log -Pattern '^(FAIL|ERROR):' | ForEach-Object {
            Write-Host "::error title=unittest::$($_.Line)"
          }
      - name: Upload unit test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unittest-output
          path: unittest-output.log
      - name: DSH plugin syntax check
        run: node --check dsh-plugin/index.js
      - name: Monitor benchmark
        shell: pwsh
        run: |
          python tests/benchmark_monitor.py --ticks 5000 --report benchmark-report.json 2>&1 | Tee-Object -FilePath bench-monitor.log
          exit $LASTEXITCODE
      - name: Desktop sources benchmark
        shell: pwsh
        run: |
          python tests/benchmark_desktop_sources.py --ticks 5000 --report desktop-source-benchmark.json 2>&1 | Tee-Object -FilePath bench-desktop.log
          exit $LASTEXITCODE
      - name: Presentation benchmark
        shell: pwsh
        run: |
          python tests/benchmark_presentation.py --report presentation-benchmark.json 2>&1 | Tee-Object -FilePath bench-presentation.log
          exit $LASTEXITCODE
      - name: UI architecture benchmark
        shell: pwsh
        run: |
          python tests/benchmark_ui_architecture.py --report ui-architecture-benchmark.json 2>&1 | Tee-Object -FilePath bench-ui.log
          exit $LASTEXITCODE
      - name: Publish benchmark failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem bench-*.log -ErrorAction SilentlyContinue | ForEach-Object {
            $name = $_.Name
            $raw = Get-Content $_.FullName -Raw
            $tail = $raw.Substring([Math]::Max(0, $raw.Length - 6000))
            Add-Content $env:GITHUB_STEP_SUMMARY "## $name`n``````$tail``````"
            Select-String -Path $_.FullName -Pattern '\[FAIL\]|BENCHMARK FAILED|Traceback' | ForEach-Object {
              Write-Host "::error title=$name::$($_.Line.Trim())"
            }
          }
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monitor-benchmark
          path: benchmark-report.json
      - name: Upload presentation benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: presentation-benchmark
          path: presentation-benchmark.json
      - name: Upload UI architecture benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-architecture-benchmark
          path: ui-architecture-benchmark.json
      - name: Upload desktop sources benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-source-benchmark
          path: desktop-source-benchmark.json
      # 单测已覆盖：terminal window activation 逻辑、并发激活矩阵、
      # source-disabled 停扫、config 运行时 clamp。
      # 真实 Windows Terminal foreground policy / UIA 事件接受度属于
      # 本机 manual acceptance（tools/terminal_window_probe.py 与
      # tools/terminal_observer_probe.py）；CI 只验证纯逻辑、Win32
      # 调用契约 mock、资源边界和 UI dataflow，不操作真实终端。
      # benchmark 保持 blocking（无 continue-on-error）：失败时靠上传的
      # benchmark-report.json 定位具体不变量。
